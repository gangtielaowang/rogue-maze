<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <style>
        html, body { margin: 0; padding: 0; background: #0d0d0d; }
        #game-container { width: 100vw; height: 100vh; border: 2px solid red; }
        #game-canvas { display: block; }
        #debug { position: fixed; top: 0; left: 0; color: #0f0; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.8); padding: 10px; }
    </style>
</head>
<body>
    <div id="debug"></div>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>
    
    <script src="maze-generator.js"></script>
    <script>
        const CELL_SIZE = 40;
        const GRID_COLS = window.GRID_COLS || 9;
        const GRID_ROWS = window.GRID_ROWS || 16;
        const SCREEN_COLS = window.SCREEN_COLS || 10;
        const SCREEN_ROWS = window.SCREEN_ROWS || 10;

        const CELL_TYPE = window.CELL_TYPE || { WALL: 0, PATH: 1, CHEST: 2, EXIT: 3 };
        CELL_TYPE.PLAYER = 4;

        const COLORS = {
            wall: '#2a2118',
            wallEdge: '#3d3024',
            path: '#12100c',
            fog: '#080808',
            player: '#ff6b35'
        };

        function log(msg) {
            document.getElementById('debug').innerHTML += msg + '<br>';
            console.log(msg);
        }

        log('=== Starting Simple Test ===');
        log('CELL_TYPE:', JSON.stringify(CELL_TYPE));
        log('GRID_COLS:', GRID_COLS);
        log('GRID_ROWS:', GRID_ROWS);

        class GameMap {
            constructor() {
                this.screens = [];
                this.currentScreenX = 0;
                this.currentScreenY = 0;
                this.playerLocalPos = { x: 4, y: 7 };
                this.seed = 12345;
                log('GameMap created with seed:', this.seed);
                this.generateWorld();
            }

            generateWorld() {
                try {
                    log('Generating world...');
                    const generator = new GlobalMazeGenerator(this.seed);
                    const globalGrid = generator.generate();
                    log('Global grid generated:', globalGrid.length + 'x' + globalGrid[0].length);

                    for (let screenY = 0; screenY < SCREEN_ROWS; screenY++) {
                        this.screens[screenY] = [];
                        for (let screenX = 0; screenX < SCREEN_COLS; screenX++) {
                            const screen = new Screen(screenX, screenY);
                            for (let localY = 0; localY < GRID_ROWS; localY++) {
                                for (let localX = 0; localX < GRID_COLS; localX++) {
                                    const globalX = screenX * GRID_COLS + localX;
                                    const globalY = screenY * GRID_ROWS + localY;
                                    screen.grid[localY][localX] = globalGrid[globalY][globalX];
                                }
                            }
                            this.screens[screenY][screenX] = screen;
                        }
                    }
                    log('World generated successfully');
                } catch (e) {
                    log('ERROR generating world:', e.message);
                }
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.container = document.getElementById('game-container');
                
                log('Canvas:', this.canvas);
                log('Container:', this.container);
                
                this.map = new GameMap();
                this.setupCanvas();
                this.render();
            }

            setupCanvas() {
                this.screenWidth = this.container.clientWidth;
                this.screenHeight = this.container.clientHeight;
                this.cellWidth = this.screenWidth / GRID_COLS;
                this.cellHeight = this.screenHeight / GRID_ROWS;
                
                log('Screen size:', this.screenWidth + 'x' + this.screenHeight);
                log('Cell size:', this.cellWidth + 'x' + this.cellHeight);

                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.screenWidth * dpr;
                this.canvas.height = this.screenHeight * dpr;
                this.canvas.style.width = this.screenWidth + 'px';
                this.canvas.style.height = this.screenHeight + 'px';
                this.ctx.scale(dpr, dpr);
            }

            render() {
                log('Rendering...');
                this.ctx.fillStyle = COLORS.fog;
                this.ctx.fillRect(0, 0, this.screenWidth, this.screenHeight);

                const screen = this.map.screens[this.map.currentScreenY][this.map.currentScreenX];
                for (let y = 0; y < GRID_ROWS; y++) {
                    for (let x = 0; x < GRID_COLS; x++) {
                        const cellX = x * this.cellWidth;
                        const cellY = y * this.cellHeight;
                        const cell = screen.grid[y][x];

                        if (cell === CELL_TYPE.WALL) {
                            this.ctx.fillStyle = COLORS.wall;
                            this.ctx.fillRect(cellX, cellY, this.cellWidth, this.cellHeight);
                        } else {
                            this.ctx.fillStyle = COLORS.path;
                            this.ctx.fillRect(cellX, cellY, this.cellWidth, this.cellHeight);
                        }
                    }
                }

                const playerX = this.map.playerLocalPos.x * this.cellWidth;
                const playerY = this.map.playerLocalPos.y * this.cellHeight;
                this.ctx.fillStyle = COLORS.player;
                this.ctx.beginPath();
                this.ctx.arc(playerX + this.cellWidth/2, playerY + this.cellHeight/2, Math.min(this.cellWidth, this.cellHeight)/3, 0, Math.PI*2);
                this.ctx.fill();

                log('Render complete');
            }
        }

        window.addEventListener('load', () => {
            log('Page loaded, creating game...');
            try {
                const game = new Game();
                log('Game created successfully!');
            } catch (e) {
                log('ERROR creating game:', e.message);
                log('Stack:', e.stack);
            }
        });
    </script>
</body>
</html>
