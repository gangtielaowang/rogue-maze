<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rogue Maze</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        /* ── 游戏画面区（上） ── */
        #game-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            min-height: 0;
        }
        #game-viewport canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        /* ── 控制区（下） ── */
        #game-controls {
            flex: 0 0 auto;
            height: 150px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-top: 1px solid #222;
            position: relative;
            z-index: 10;
        }
        @media (max-height: 640px) {
            #game-controls { height: 140px; padding: 3px 6px; }
        }
        @media (max-height: 520px) {
            #game-controls { height: 120px; padding: 2px 4px; }
        }

        .ctrl-left {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .ctrl-right {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .ctrl-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-width: 100px;
        }

        /* ── 控制区按钮 ── */
        .ctrl-btn {
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 5px 10px;
            border: 1.5px solid rgba(200,200,220,0.25);
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: rgba(200,200,220,0.7);
            cursor: pointer;
            touch-action: manipulation;
            min-width: 52px;
            text-align: center;
            line-height: 1.2;
        }
        .ctrl-btn:active {
            background: rgba(255,255,255,0.14);
        }
        .ctrl-btn.open {
            border-color: rgba(200, 180, 80, 0.45);
            color: rgba(220, 200, 100, 0.85);
            background: rgba(200, 180, 80, 0.1);
        }
        .ctrl-btn.dash {
            border-color: rgba(100, 200, 255, 0.35);
            color: rgba(100, 200, 255, 0.65);
        }
        .ctrl-btn.dash.active {
            border-color: rgba(100, 200, 255, 0.85);
            color: rgba(100, 200, 255, 1);
            background: rgba(100, 200, 255, 0.12);
        }
        .ctrl-btn.booster {
            border-color: rgba(130, 180, 255, 0.35);
            color: rgba(130, 180, 255, 0.65);
        }
        .ctrl-btn.booster.active {
            border-color: rgba(130, 180, 255, 0.85);
            color: rgba(130, 180, 255, 1);
            background: rgba(130, 180, 255, 0.12);
        }
        /* 道具小按钮 */
        .ctrl-btn.item {
            font-size: 10px;
            padding: 3px 6px;
            min-width: 36px;
            border-radius: 4px;
        }
        .ctrl-btn.item.active {
            border-color: rgba(255, 180, 80, 0.85);
            color: rgba(255, 200, 120, 1);
            background: rgba(255, 180, 80, 0.12);
        }

        /* ── HUD 覆盖层（浮在画面上） ── */
        #hud-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            font-family: monospace;
            font-size: 12px;
            color: rgba(200, 200, 220, 0.8);
        }
        .hud-item {
            position: absolute;
            background: rgba(0,0,0,0.5);
            padding: 3px 7px;
            border-radius: 3px;
            line-height: 1.5;
            font-size: 11px;
        }
        #hud-coords { top: 6px; left: 6px; }
        #hud-echo { top: 40px; left: 6px; }
        #hud-drop-msg {
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #ffd700;
            line-height: 1.3;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        /* ── 小地图 ── */
        #minimap-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        #minimap-wrap canvas {
            border: 1px solid #333;
            border-radius: 3px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .minimap-label {
            font-size: 8px;
            color: rgba(200,200,220,0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 游戏画面 -->
        <div id="game-viewport">
            <!-- canvas 由 bootstrap 插入 -->
            <div id="hud-overlay">
                <div class="hud-item" id="hud-coords">X: 0  Y: 0</div>
                <div class="hud-item" id="hud-echo">♫ Echo: 0/0</div>
                <div class="hud-item" id="hud-items" style="top:72px;left:6px;font-size:10px;"></div>
                <div class="hud-item" id="hud-status" style="top:6px;right:6px;text-align:right;font-size:10px;"></div>
                <div id="hud-drop-msg"></div>
            </div>
        </div>

        <!-- 控制区 -->
        <div id="game-controls">
            <div class="ctrl-left">
                <div id="minimap-wrap">
                    <!-- minimap canvas 由 bootstrap 插入 -->
                    <span class="minimap-label">MAP</span>
                </div>
            </div>
            <div class="ctrl-center">
                <!-- 摇杆由 bootstrap mount 到这里 -->
            </div>
            <div class="ctrl-right">
                <!-- 按钮由 bootstrap 创建 -->
            </div>
        </div>
    </div>
    <script type="module" src="src/platform/web-bootstrap.js"></script>
</body>
</html>
