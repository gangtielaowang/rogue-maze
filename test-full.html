<!DOCTYPE html>
<html>
<head>
    <title>Full Test</title>
    <style>
        body { 
            background: #0d0d0d; 
            color: #fff; 
            font-family: monospace; 
            margin: 0;
            padding: 20px;
        }
        #log {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="log"></div>
    
    <script src="maze-generator.js"></script>
    <script>
        function log(msg) {
            document.getElementById('log').innerHTML += msg + '<br>';
            console.log(msg);
        }

        log('=== Testing maze generator ===');
        log('CELL_TYPE:', JSON.stringify(window.CELL_TYPE));
        log('SCREEN_COLS:', window.SCREEN_COLS);
        log('SCREEN_ROWS:', window.SCREEN_ROWS);
        log('GRID_COLS:', window.GRID_COLS);
        log('GRID_ROWS:', window.GRID_ROWS);
        log('Screen class exists:', typeof window.Screen === 'function');
        log('GlobalMazeGenerator class exists:', typeof window.GlobalMazeGenerator === 'function');

        try {
            log('');
            log('=== Creating generator ===');
            const generator = new GlobalMazeGenerator(12345);
            log('Generator created:', generator);

            log('');
            log('=== Generating maze ===');
            const grid = generator.generate();
            log('Grid generated:', grid.length, 'rows x', grid[0].length, 'cols');

            log('');
            log('=== Creating Screen ===');
            const screen = new Screen(0, 0);
            log('Screen created:', screen);
            log('Screen grid size:', screen.grid.length, 'x', screen.grid[0].length);

            log('');
            log('=== Testing GameMap-like logic ===');
            const screens = [];
            for (let screenY = 0; screenY < 3; screenY++) {
                screens[screenY] = [];
                for (let screenX = 0; screenX < 3; screenX++) {
                    const s = new Screen(screenX, screenY);
                    for (let localY = 0; localY < GRID_ROWS; localY++) {
                        for (let localX = 0; localX < GRID_COLS; localX++) {
                            const globalX = screenX * GRID_COLS + localX;
                            const globalY = screenY * GRID_ROWS + localY;
                            if (globalY < grid.length && globalX < grid[0].length) {
                                s.grid[localY][localX] = grid[globalY][globalX];
                            }
                        }
                    }
                    screens[screenY][screenX] = s;
                }
            }
            log('Screens created:', screens.length, 'x', screens[0].length);
            log('Screen[0][0] grid sample:', screens[0][0].grid[0].slice(0, 5));

            log('');
            log('=== SUCCESS ===');
        } catch (e) {
            log('');
            log('=== ERROR ===');
            log('Error:', e.message);
            log('Stack:', e.stack);
        }
    </script>
</body>
</html>
