<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; font-size: 14px; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <div id="output"></div>
    
    <script>
        function log(msg, type='info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = msg;
            document.getElementById('output').appendChild(div);
            console.log(msg);
        }

        log('=== Starting Debug ===', 'info');
        
        // First check if maze-generator.js is loaded
        log('Checking maze-generator.js classes before loading...', 'info');
        log('CELL_TYPE exists:', typeof CELL_TYPE !== 'undefined', 'success');
        log('Screen exists:', typeof Screen !== 'undefined', 'success');
        log('GlobalMazeGenerator exists:', typeof GlobalMazeGenerator !== 'undefined', 'success');
        
        // Load the script dynamically
        const script = document.createElement('script');
        script.src = 'maze-generator.js';
        script.onload = function() {
            log('', 'info');
            log('=== After loading maze-generator.js ===', 'info');
            log('CELL_TYPE:', typeof window.CELL_TYPE, 'success');
            log('SCREEN_COLS:', window.SCREEN_COLS, 'success');
            log('SCREEN_ROWS:', window.SCREEN_ROWS, 'success');
            log('GRID_COLS:', window.GRID_COLS, 'success');
            log('GRID_ROWS:', window.GRID_ROWS, 'success');
            log('Screen:', typeof window.Screen, 'success');
            log('GlobalMazeGenerator:', typeof window.GlobalMazeGenerator, 'success');
            
            try {
                log('', 'info');
                log('=== Testing GlobalMazeGenerator ===', 'info');
                const gen = new GlobalMazeGenerator(123);
                log('Generator created successfully', 'success');
                
                const grid = gen.generate();
                log('Grid generated:', grid.length + 'x' + grid[0].length, 'success');
                
                log('', 'info');
                log('=== Testing Screen ===', 'info');
                const screen = new Screen(0, 0);
                log('Screen created:', screen.grid.length + 'x' + screen.grid[0].length, 'success');
                
                log('', 'info');
                log('=== ALL TESTS PASSED ===', 'success');
            } catch (e) {
                log('ERROR:', e.message, 'error');
                log('Stack:', e.stack, 'error');
            }
        };
        script.onerror = function() {
            log('FAILED to load maze-generator.js', 'error');
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
