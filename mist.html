            stopAnimationLoop() {
                if (this.animFrameId) {
                    cancelAnimationFrame(this.animFrameId);
                    this.animFrameId = null;
                }
            }

            updateMovement(timestamp) {
                try {
                    if (this.gameOver || this.petrifying || this.victoryAnimating) return;
                    if (this.chestOpenMode) {
                        return;
                    }

                    const dt = Math.min((timestamp - this.prevTimestamp) / 1000, 0.1);

                    let mdx = 0, mdy = 0;

                    if (this.keysDown.up) mdy -= 1;
                    if (this.keysDown.down) mdy += 1;
                    if (this.keysDown.left) mdx -= 1;
                    if (this.keysDown.right) mdx += 1;
                    const kmag = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (kmag > 0) { mdx /= kmag; mdy /= kmag; }

                    if (this.joystickDir) {
                        mdx = this.joystickDir.dx;
                        mdy = this.joystickDir.dy;
                    }

                    if (mdx !== 0 || mdy !== 0) {
                        this.playerIsMoving = true;
                        const angle = Math.atan2(mdy, mdx) * 180 / Math.PI;
                        if (angle >= -45 && angle < 45) this.playerDirection = 'right';
                        else if (angle >= 45 && angle < 135) this.playerDirection = 'down';
                        else if (angle >= -135 && angle < -45) this.playerDirection = 'up';
                        else this.playerDirection = 'left';

                        if (this.autoMoveActive) {
                            this.stopAutoMove();
                        }
                        const moveSpeedPixels = this.MOVE_SPEED * this.cellWidth;
                        const targetX = this.playerPixelX + mdx * moveSpeedPixels * dt;
                        const targetY = this.playerPixelY + mdy * moveSpeedPixels * dt;

                        const result = this.checkBoundaryCollision(targetX, targetY, mdx, mdy);
                        this.playerPixelX = result.x;
                        this.playerPixelY = result.y;

                        if (result.cellChanged) {
                            this.handleCellTransition();
                        }
                    } else {
                        this.playerIsMoving = false;
                    }

                    if (!this.gameOver && !this.petrifying) {
                        this.calcCamera(dt);
                        this.updateScreenPos();
                    }

                    if (this.echoCount <= 0 && !this.gameOver && !this.petrifying) {
                        this.startPetrifyAnimation();
                    }
                } catch (e) {
                    console.error('Movement update error:', e);
                }
            }

            handleCellTransition() {
                const gx = this.map.playerGlobalX;
                const gy = this.map.playerGlobalY;

                if (gx === this.map.exitGlobalX && gy === this.map.exitGlobalY) {
                    this.updateUI();
                    this.updateScreenPos();
                    this.render();
                    this.startVictoryAnimation();
                    return;
                }

                this.checkRemnantPickup();
                this.updateUI();

                if ((this.keysDown.up || this.keysDown.down || this.keysDown.left || this.keysDown.right) || this.joystickDir) {
                    this.checkChestCollision();
                }
            }

            updateScreenPos() {
                this.playerScreenX = (this.playerPixelX - this.camStartX * this.cellWidth) / this.cellWidth;
                this.playerScreenY = (this.playerPixelY - this.camStartY * this.cellHeight) / this.cellHeight;
                this.renderCamX = this.camStartX;
                this.renderCamY = this.camStartY;
            }

            setupEventListeners() {
                document.getElementById('backpack-btn').addEventListener('click', () => this.showBackpack());
                document.getElementById('overlay-close').addEventListener('click', () => this.hideOverlay());
                document.getElementById('overlay').addEventListener('click', (e) => {
                    if (e.target.id === 'overlay') this.hideOverlay();
                });

                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                document.addEventListener('keyup', (e) => this.handleKeyUp(e));

                let touchStartX, touchStartY;
                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });

                this.canvas.addEventListener('touchend', (e) => {
                    if (!touchStartX || !touchStartY) return;

                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;

                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;

                    const minSwipe = 30;

                    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > minSwipe) {
                        if (dx > 0) this.movePlayer(1, 0);
                        else this.movePlayer(-1, 0);
                    } else if (Math.abs(dy) > minSwipe) {
                        if (dy > 0) this.movePlayer(0, 1);
                        else this.movePlayer(0, -1);
                    }

                    touchStartX = null;
                    touchStartY = null;
                });

                this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));

                this.setupJoystick();
            }

            setupJoystick() {
                const base = document.getElementById('joystick-base');
                const thumb = document.getElementById('joystick-thumb');
                const baseSize = 150;
                const thumbSize = 50;
                const maxDist = (baseSize - thumbSize) / 2;
                const deadZone = 18;

                let activeTouchId = null;

                const updateJoystick = (clientX, clientY) => {
                    const rect = base.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    let dx = clientX - cx;
                    let dy = clientY - cy;

                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < deadZone) {
                        thumb.style.transform = 'translate(-50%, -50%)';
                        this.joystickDir = null;
                        return;
                    }

                    this.joystickDir = { dx: dx / dist, dy: dy / dist };

                    const clampedDist = Math.min(dist, maxDist);
                    const moveX = (dx / dist) * clampedDist;
                    const moveY = (dy / dist) * clampedDist;
                    thumb.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
                };

                const resetJoystick = () => {
                    activeTouchId = null;
                    this.joystickDir = null;
                    thumb.style.transform = 'translate(-50%, -50%)';
                    base.classList.remove('active');
                };

                const handleStart = (e) => {
                    e.preventDefault();
                    const touch = e.touches ? e.touches[0] : e;
                    activeTouchId = e.touches ? touch.identifier : 'mouse';
                    base.classList.add('active');
                    updateJoystick(touch.clientX, touch.clientY);
                };

                const handleMove = (e) => {
                    e.preventDefault();
                    if (activeTouchId === null) return;
                    let touch = null;
                    if (e.touches) {
                        for (let i = 0; i < e.touches.length; i++) {
                            if (e.touches[i].identifier === activeTouchId) {
                                touch = e.touches[i];
                                break;
                            }
                        }
                        if (!touch) return;
                    } else {
                        touch = e;
                    }
                    updateJoystick(touch.clientX, touch.clientY);
                };

                const handleEnd = (e) => {
                    e.preventDefault();
                    if (activeTouchId === null) return;
                    if (e.touches) {
                        let found = false;
                        for (let i = 0; i < e.touches.length; i++) {
                            if (e.touches[i].identifier === activeTouchId) {
                                found = true;
                                break;
                            }
                        }
                        if (found) return;
                    }
                    resetJoystick();
                };

                base.addEventListener('touchstart', handleStart, { passive: false });
                base.addEventListener('touchmove', handleMove, { passive: false });
                base.addEventListener('touchend', handleEnd);
                base.addEventListener('touchcancel', handleEnd);

                base.addEventListener('mousedown', handleStart);
                document.addEventListener('mousemove', (e) => {
                    if (activeTouchId === 'mouse') {
                        updateJoystick(e.clientX, e.clientY);
                    }
                });
                document.addEventListener('mouseup', () => {
                    if (activeTouchId === 'mouse') {
                        resetJoystick();
                    }
                });
            }

            handleKeyDown(e) {
                if (e.repeat) return;

                if (this.gameOver) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        this.restart();
                    }
                    return;
                }

                if (this.chestOpenMode && typeof this.chestOpenMode !== 'string') return;

                const dir = this.getDirFromKey(e.key);
                if (dir) {
                    this.keysDown[dir] = true;
                    return;
                }

                if (e.key === 'f' || e.key === 'F') {
                    this.activateBooster();
                }

                // skill hotkeys
                if (this.chestOpenMode === 'voidStep' || this.chestOpenMode === 'magneticGlove') {
                    const targetCell = this.highlightedCell;
                    if (!targetCell) return;
                    if (e.key === 'Enter' || e.key === ' ') {
                        this.confirmSkill(targetCell);
                    } else if (e.key === 'Escape') {
                        this.cancelSkill();
                    }
                }
            }

            handleKeyUp(e) {
                const dir = this.getDirFromKey(e.key);
                if (dir) {
                    this.keysDown[dir] = false;
                }
            }

            getDirFromKey(key) {
                switch (key) {
                    case 'ArrowUp': case 'w': case 'W': return 'up';
                    case 'ArrowDown': case 's': case 'S': return 'down';
                    case 'ArrowLeft': case 'a': case 'A': return 'left';
                    case 'ArrowRight': case 'd': case 'D': return 'right';
                }
                return null;
            }

            checkChestCollision() {
                const px = this.map.playerGlobalX;
                const py = this.map.playerGlobalY;

                if (this.map.globalGrid[py][px] !== CELL_TYPE.CHEST) return;

                const key = `${py},${px}`;
                const isConditional = this.map.chestConditional && this.map.chestConditional[key];

                if (isConditional && !this.boosterActive) return;

                if (isConditional && !this.chestCostFree) {
                    if (this.capsules.length > 0) {
                        this.showChestCostPrompt(px, py);
                    }
                    return;
                }

                this.openChest(px, py);
            }

            showChestCostPrompt(px, py) {
                this.chestOpenMode = { px, py, isConditional: true };
                const title = document.getElementById('overlay-title');
                title.textContent = '条件记忆匣';
                document.getElementById('overlay-body').innerHTML = `
                    <div style="text-align:center;padding:16px 0;">
                        <div style="font-size:48px;margin-bottom:12px;">🔒</div>
                        <div style="color:var(--text-primary);margin-bottom:8px;">这个记忆匣需要消耗一个追忆才能打开</div>
                        <div style="color:var(--text-secondary);font-size:13px;margin-bottom:20px;">将随机消耗背包中的一个追忆</div>
                        <button class="restart-btn" id="chest-open-btn" style="margin-right:12px;">消耗并开启</button>
                        <button class="restart-btn" id="chest-cancel-btn" style="background:rgba(255,255,255,0.15);box-shadow:none;">放弃</button>
                    </div>
                `;
                document.getElementById('overlay').classList.add('active');
                document.getElementById('overlay-close').style.display = 'none';

                document.getElementById('chest-open-btn').addEventListener('click', () => {
                    const idx = Math.floor(Math.random() * this.capsules.length);
                    this.capsules.splice(idx, 1);
                    document.getElementById('overlay-close').style.display = '';
                    this.hideOverlay();
                    this.openChest(this.chestOpenMode.px, this.chestOpenMode.py);
                    this.chestOpenMode = null;
                });

                document.getElementById('chest-cancel-btn').addEventListener('click', () => {
                    document.getElementById('overlay-close').style.display = '';
                    this.hideOverlay();
                    this.chestOpenMode = null;
                });
            }

            openChest(px, py) {
                this.map.globalGrid[py][px] = CELL_TYPE.PATH;
                const key = `${py},${px}`;
                if (this.map.chestConditional && this.map.chestConditional[key]) {
                    delete this.map.chestConditional[key];
                }

                this.keysDown = { up: false, down: false, left: false, right: false };
                this.joystickDir = null;
                this.playerIsMoving = false;

                const drop = CapsuleHelper.getRandomDrop();
                if (!drop) return;

                if (this.capsules.length >= BACKPACK_CAPACITY) {
                    this.showChestReplacePrompt(drop, px, py);
                } else {
                    this.capsules.push({ id: drop.id });
                    this.showChestResult(drop, false);
                }
            }

            showChestReplacePrompt(drop, px, py) {
                this.chestOpenMode = { px, py, drop };
                const title = document.getElementById('overlay-title');
                title.textContent = '背包已满';
                document.getElementById('overlay-body').innerHTML = `
                    <div style="text-align:center;padding:16px 0;">
                        <div style="font-size:48px;margin-bottom:12px;">${drop.icon}</div>
                        <div style="color:var(--text-primary);margin-bottom:4px;">获得: ${drop.name}</div>
                        <div style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">背包已满(${BACKPACK_CAPACITY}件)，请选择替换或丢弃</div>
                        <div id="replace-options" style="display:flex;flex-direction:column;gap:8px;"></div>
                        <button class="restart-btn" id="chest-discard-btn" style="margin-top:12px;background:rgba(255,255,255,0.15);box-shadow:none;">丢弃新追忆</button>
                    </div>
                `;
                document.getElementById('overlay').classList.add('active');
                document.getElementById('overlay-close').style.display = 'none';

                const optionsDiv = document.getElementById('replace-options');
                this.capsules.forEach((cap, idx) => {
                    const def = CapsuleHelper.getById(cap.id);
                    const btn = document.createElement('button');
                    btn.className = 'restart-btn';
                    btn.style.cssText = 'font-size:13px;padding:10px 16px;background:rgba(255,255,255,0.1);box-shadow:none;';
                    btn.textContent = `替换 ${def ? def.icon + ' ' + def.name : cap.id}`;
                    btn.addEventListener('click', () => {
                        this.capsules[idx] = { id: drop.id };
                        document.getElementById('overlay-close').style.display = '';
                        this.hideOverlay();
                        this.showChestResult(drop, true);
                        this.chestOpenMode = null;
                    });
                    optionsDiv.appendChild(btn);
                });

                document.getElementById('chest-discard-btn').addEventListener('click', () => {
                    document.getElementById('overlay-close').style.display = '';
                    this.hideOverlay();
                    this.chestOpenMode = null;
                });
            }

            showChestResult(drop, replaced) {
                const title = document.getElementById('overlay-title');
                title.textContent = '获得追忆';
                document.getElementById('overlay-body').innerHTML = `
                    <div style="text-align:center;padding:16px 0;">
                        <div style="font-size:64px;margin-bottom:12px;">${drop.icon}</div>
                        <div style="color:var(--chest-color);font-size:20px;font-weight:700;margin-bottom:4px;">${drop.name}</div>
                        <div style="color:var(--text-secondary);font-size:13px;margin-bottom:8px;">${drop.description}</div>
                        <div style="color:var(--text-secondary);font-size:12px;">${drop.category === 'persistent' ? '持久型 · 自动生效' : '消耗型 · 主动使用'}</div>
                        ${replaced ? '<div style="color:#ff6b35;font-size:12px;margin-top:4px;">已替换旧追忆</div>' : ''}
                        <button class="restart-btn" id="chest-ok-btn" style="margin-top:16px;">确定</button>
                    </div>
                `;
                document.getElementById('overlay').classList.add('active');
                document.getElementById('overlay-close').style.display = 'none';

                document.getElementById('chest-ok-btn').addEventListener('click', () => {
                    document.getElementById('overlay-close').style.display = '';
                    this.hideOverlay();
                    if (drop.category === 'persistent') {
                        CapsuleHelper.applyPersistentEffects(this, [{ id: drop.id }]);
                    }
                    this.render();
                });
            }

            tickTimer(timestamp) {
                if (this.gameOver || this.petrifying || this.victoryAnimating) return;
                if (this.timerPaused) {
                    this.lastTimerTick = 0;
                    return;
                }
                if (this.lastTimerTick === 0) {
                    this.lastTimerTick = timestamp;
                    return;
                }
                const elapsed = timestamp - this.lastTimerTick;
                if (elapsed >= 1000) {
                    const seconds = Math.floor(elapsed / 1000);
                    this.echoCount = Math.max(0, this.echoCount - seconds);
                    this.lastTimerTick = timestamp - (elapsed % 1000);
                    this.updateUI();
                    if (this.echoCount <= 0 && !this.gameOver) {
                        this.startPetrifyAnimation();
                    }
                }
            }

            checkBooster(timestamp) {
                if (this.boosterActive && this.boosterEndTime > 0) {
                    if (timestamp >= this.boosterEndTime) {
                        this.boosterActive = false;
                        this.visionRange = BASE_VISION_RANGE;
                        this.boosterEndTime = 0;
                        this.updateBoosterUI();
                    }
                }
            }

            activateBooster() {
                if (this.gameOver || this.petrifying || this.victoryAnimating) return;
                if (this.boosterActive) return;
                if (this.echoCount < BOOST_ECHO_COST) return;

                this.echoCount -= BOOST_ECHO_COST;
                this.boosterActive = true;
                this.boosterEndTime = performance.now() + BOOST_DURATION * 1000;
                this.visionRange = BOOST_VISION_RANGE;
                this.updateUI();
                this.updateBoosterUI();
            }

            updateBoosterUI() {
                const btn = document.getElementById('booster-btn');
                if (!btn) return;
                if (this.boosterActive) {
                    const remaining = Math.ceil(Math.max(0, this.boosterEndTime - performance.now()) / 1000);
                    btn.classList.add('active');
                    btn.textContent = `${remaining}s`;
                    btn.disabled = true;
                } else {
                    btn.classList.remove('active');
                    btn.textContent = '共鸣';
                    btn.disabled = this.echoCount < BOOST_ECHO_COST;
                }
            }

            generateRemnants() {
                this.remnants = [];
                const pathCells = [];
                const nearSpawn = [];
                const px = this.map.playerGlobalX;
                const py = this.map.playerGlobalY;
                const ex = this.map.exitGlobalX;
                const ey = this.map.exitGlobalY;

                for (let gy = 0; gy < TOTAL_ROWS; gy++) {
                    for (let gx = 0; gx < TOTAL_COLS; gx++) {
                        const cell = this.map.globalGrid[gy][gx];
                        if (cell !== CELL_TYPE.PATH) continue;
                        if (gx === px && gy === py) continue;
                        if (gx === ex && gy === ey) continue;

                        const dist = Math.abs(gx - px) + Math.abs(gy - py);
                        if (dist <= 5 && dist >= 2) {
                            nearSpawn.push({ gx, gy });
                        } else {
                            pathCells.push({ gx, gy });
                        }
                    }
                }

                const guaranteedNear = Math.min(2, nearSpawn.length);
                for (let i = 0; i < guaranteedNear; i++) {
                    const idx = Math.floor(Math.random() * nearSpawn.length);
                    const cell = nearSpawn.splice(idx, 1)[0];
                    this.remnants.push({
                        gx: cell.gx,
                        gy: cell.gy,
                        value: Math.random() < 0.25 ? REMNANT_LARGE : REMNANT_SMALL,
                        collected: false
                    });
                }

                for (const cell of nearSpawn) {
                    pathCells.push(cell);
                }

                const totalRemnants = Math.max(6, Math.floor(pathCells.length * REMNANT_DENSITY / 40));
                for (let i = 0; i < totalRemnants; i++) {
                    if (pathCells.length === 0) break;
                    const idx = Math.floor(Math.random() * pathCells.length);
                    const cell = pathCells.splice(idx, 1)[0];
                    this.remnants.push({
                        gx: cell.gx,
                        gy: cell.gy,
                        value: Math.random() < 0.25 ? REMNANT_LARGE : REMNANT_SMALL,
                        collected: false
                    });
                }
            }

            checkRemnantPickup() {
                const px = this.map.playerGlobalX;
                const py = this.map.playerGlobalY;
                for (const r of this.remnants) {
                    if (!r.collected && r.gx === px && r.gy === py) {
                        r.collected = true;
                        this.echoCount = Math.min(this.echoCount + r.value, this.echoCapacity);
                        this.updateUI();
                        break;
                    }
                }
            }

            drawVisionCutout(ctx, cx, cy, innerR, outerR, time = 0) {
                const breathe = 1 + Math.sin(time * 1.05) * 0.05;
                const outerRA = outerR * breathe;
                const maxExtent = outerRA * 1.7;

                const g1 = ctx.createRadialGradient(cx, cy, innerR * 0.85, cx, cy, outerRA * 0.92);
                g1.addColorStop(0, 'rgba(0,0,0,1)');
                g1.addColorStop(0.5, 'rgba(0,0,0,1)');
                g1.addColorStop(0.68, 'rgba(0,0,0,0.55)');
                g1.addColorStop(0.84, 'rgba(0,0,0,0.15)');
                g1.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g1;
                ctx.fillRect(cx - maxExtent, cy - maxExtent, maxExtent * 2, maxExtent * 2);

                const g2 = ctx.createRadialGradient(cx, cy, outerRA * 0.78, cx, cy, outerRA * 1.08);
                g2.addColorStop(0, 'rgba(8, 10, 28, 0.22)');
                g2.addColorStop(0.5, 'rgba(6, 8, 24, 0.08)');
                g2.addColorStop(1, 'rgba(4, 6, 20, 0)');
                ctx.fillStyle = g2;
                ctx.fillRect(cx - maxExtent, cy - maxExtent, maxExtent * 2, maxExtent * 2);

                const shimmer = Math.sin(time * 1.3 + cx * 0.01) * 0.04 + 0.04;
                const g3 = ctx.createRadialGradient(cx, cy, outerRA * 0.9, cx, cy, outerRA * 1.25);
                g3.addColorStop(0, `rgba(10, 14, 32, ${shimmer})`);
                g3.addColorStop(0.6, `rgba(8, 10, 28, ${shimmer * 0.5})`);
                g3.addColorStop(1, 'rgba(4, 6, 20, 0)');
                ctx.fillStyle = g3;
                ctx.fillRect(cx - maxExtent, cy - maxExtent, maxExtent * 2, maxExtent * 2);
            }

            updateSeenCells(pixelX, pixelY, radius) {
                const cellSize = this.cellWidth;
                const cellsRadius = Math.ceil(radius / cellSize) + 1;
                const centerGX = Math.round(pixelX / cellSize);
                const centerGY = Math.round(pixelY / cellSize);
                const minGX = Math.max(0, centerGX - cellsRadius);
                const maxGX = Math.min(TOTAL_COLS - 1, centerGX + cellsRadius);
                const minGY = Math.max(0, centerGY - cellsRadius);
                const maxGY = Math.min(TOTAL_ROWS - 1, centerGY + cellsRadius);
                const radiusSq = (radius / cellSize) * (radius / cellSize) * 1.3;

                for (let gy = minGY; gy <= maxGY; gy++) {
                    for (let gx = minGX; gx <= maxGX; gx++) {
                        const dcx = gx + 0.5 - centerGX;
                        const dcy = gy + 0.5 - centerGY;
                        if (dcx * dcx + dcy * dcy <= radiusSq) {
                            this.map.markSeen(gy, gx);
                        }
                    }
                }
            }

            drawFog() {
                if (!this.fogEnabled) return;

                const dpr = window.devicePixelRatio || 1;
                const viewW = this.screenWidth;
                const viewH = this.screenHeight;
                const cellSize = this.cellWidth;
                const time = performance.now() / 1000;

                const playerAbsX = this.gridOffsetX + this.playerPixelX - this.renderCamX * cellSize;
                const playerAbsY = this.gridOffsetY + this.playerPixelY - this.renderCamY * cellSize;

                const innerR = (this.boosterActive ? fogVisionBoostInner : fogVisionNormalInner) * cellSize * fogVisionCellMult;
                const outerR = (this.boosterActive ? fogVisionBoostOuter : fogVisionNormalOuter) * cellSize * fogVisionCellMult;

                this.updateSeenCells(this.playerPixelX, this.playerPixelY, outerR);

                const camIntX = Math.floor(this.renderCamX);
                const camIntY = Math.floor(this.renderCamY);
                const camFracX = this.renderCamX - camIntX;
                const camFracY = this.renderCamY - camIntY;
                const extraCols = camFracX > 0.001 ? 1 : 0;
                const extraRows = camFracY > 0.001 ? 1 : 0;

                if (!this.fogCanvas || this.fogCanvas.width !== viewW * dpr) {
                    this.fogCanvas = document.createElement('canvas');
                    this.fogCanvas.width = viewW * dpr;
                    this.fogCanvas.height = viewH * dpr;
                    this.fogCanvas.style.width = viewW + 'px';
                    this.fogCanvas.style.height = viewH + 'px';
                    this.fogCtx = this.fogCanvas.getContext('2d');
                    this.fogCtx.scale(dpr, dpr);
                }

                const fogCtx = this.fogCtx;
                fogCtx.clearRect(0, 0, viewW, viewH);
                fogCtx.fillStyle = 'rgba(10, 12, 20, 0.48)';
                fogCtx.fillRect(0, 0, viewW, viewH);

                const circleR = cellSize * fogCircleRatio;
                const hasFogFrames = this.fogAnimations && this.fogAnimations.length > 0
                    && this.fogAnimations[0] && this.fogAnimations[0].complete
                    && this.fogAnimations[0].naturalWidth > 0;

                const fogFrame = hasFogFrames ? this.fogAnimations[this.fogFrameIndex] : null;
                const frameSize = circleR * fogFrameScale;
                const now = performance.now();
                const dissolveMs = fogDissolveMs;

                const fullySeenSet = new Set();
                const dissolvingMap = new Map();

                for (let vy = -RENDER_BUFFER; vy < VIEW_ROWS + extraRows + RENDER_BUFFER; vy++) {
                    for (let vx = -RENDER_BUFFER; vx < VIEW_COLS + extraCols + RENDER_BUFFER; vx++) {
                        const gx = camIntX + vx;
                        const gy = camIntY + vy;
                        if (gx < 0 || gx >= TOTAL_COLS || gy < 0 || gy >= TOTAL_ROWS) continue;
                        const key = `${gy},${gx}`;
                        if (!this.map.seenCells.has(key)) continue;
                        const seenTime = this.map.seenCellsTime[key];
                        if (seenTime !== undefined) {
                            const elapsed = now - seenTime;
                            if (elapsed < dissolveMs) {
                                dissolvingMap.set(key, 1 - elapsed / dissolveMs);
                            } else {
                                fullySeenSet.add(key);
                            }
                        } else {
                            fullySeenSet.add(key);
                        }
                    }
                }

                const effectiveSeenSet = new Set(fullySeenSet);
                for (const key of dissolvingMap.keys()) {
                    effectiveSeenSet.add(key);
                }

                const edgeDist1 = new Set();
                const edgeDist2 = new Set();

                for (let vy = -RENDER_BUFFER; vy < VIEW_ROWS + extraRows + RENDER_BUFFER; vy++) {
                    for (let vx = -RENDER_BUFFER; vx < VIEW_COLS + extraCols + RENDER_BUFFER; vx++) {
                        const gx = camIntX + vx;
                        const gy = camIntY + vy;
                        if (gx < 0 || gx >= TOTAL_COLS || gy < 0 || gy >= TOTAL_ROWS) continue;
                        const key = `${gy},${gx}`;
                        if (effectiveSeenSet.has(key)) continue;

                        let isDist1 = false;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                const ngx = gx + dx;
                                const ngy = gy + dy;
                                if (ngx < 0 || ngx >= TOTAL_COLS || ngy < 0 || ngy >= TOTAL_ROWS) continue;
                                if (effectiveSeenSet.has(`${ngy},${ngx}`)) {
                                    isDist1 = true;
                                    break;
                                }
                            }
                            if (isDist1) break;
                        }
                        if (isDist1) edgeDist1.add(key);
                    }
                }

                for (let vy = -RENDER_BUFFER; vy < VIEW_ROWS + extraRows + RENDER_BUFFER; vy++) {
                    for (let vx = -RENDER_BUFFER; vx < VIEW_COLS + extraCols + RENDER_BUFFER; vx++) {
                        const gx = camIntX + vx;
                        const gy = camIntY + vy;
                        if (gx < 0 || gx >= TOTAL_COLS || gy < 0 || gy >= TOTAL_ROWS) continue;
                        const key = `${gy},${gx}`;
                        if (effectiveSeenSet.has(key) || edgeDist1.has(key)) continue;

                        let isDist2 = false;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                const ngx = gx + dx;
                                const ngy = gy + dy;
                                if (ngx < 0 || ngx >= TOTAL_COLS || ngy < 0 || ngy >= TOTAL_ROWS) continue;
                                if (edgeDist1.has(`${ngy},${ngx}`)) {
                                    isDist2 = true;
                                    break;
                                }
                            }
                            if (isDist2) break;
                        }
                        if (isDist2) edgeDist2.add(key);
                    }
                }

                fogCtx.save();

                const offsetX = this.gridOffsetX - camFracX * cellSize;
                const offsetY = this.gridOffsetY - camFracY * cellSize;

                for (let vy = -RENDER_BUFFER; vy < VIEW_ROWS + extraRows + RENDER_BUFFER; vy++) {
                    for (let vx = -RENDER_BUFFER; vx < VIEW_COLS + extraCols + RENDER_BUFFER; vx++) {
                        const gx = camIntX + vx;
                        const gy = camIntY + vy;
                        if (gx < 0 || gx >= TOTAL_COLS || gy < 0 || gy >= TOTAL_ROWS) continue;
                        const key = `${gy},${gx}`;
                        if (fullySeenSet.has(key)) continue;

                        const cx = offsetX + vx * cellSize + cellSize / 2;
                        const cy = offsetY + vy * cellSize + cellSize / 2;

                        const dissolveAlpha = dissolvingMap.get(key);
                        if (dissolveAlpha !== undefined) {
                            const g = fogCtx.createRadialGradient(cx, cy, circleR * 0.6, cx, cy, circleR);
                            g.addColorStop(0, `rgba(10, 12, 20, ${0.94 * dissolveAlpha})`);
                            g.addColorStop(0.4, `rgba(10, 12, 20, ${0.85 * dissolveAlpha})`);
                            g.addColorStop(0.7, `rgba(10, 12, 20, ${0.35 * dissolveAlpha})`);
                            g.addColorStop(1, 'rgba(10, 12, 20, 0)');
                            fogCtx.fillStyle = g;
                            fogCtx.fillRect(cx - circleR, cy - circleR, circleR * 2, circleR * 2);
                            if (fogFrame) {
                                fogCtx.globalAlpha = 0.4 * dissolveAlpha;
                                fogCtx.drawImage(fogFrame, cx - frameSize / 2, cy - frameSize / 2, frameSize, frameSize);
                                fogCtx.globalAlpha = 1;
                            }
                            continue;
                        }

                        if (edgeDist1.has(key)) {
                            const g = fogCtx.createRadialGradient(cx, cy, circleR * 0.6, cx, cy, circleR);
                            g.addColorStop(0, 'rgba(10, 12, 20, 0.94)');
                            g.addColorStop(0.4, 'rgba(10, 12, 20, 0.85)');
                            g.addColorStop(0.7, 'rgba(10, 12, 20, 0.35)');
                            g.addColorStop(1, 'rgba(10, 12, 20, 0)');
                            fogCtx.fillStyle = g;
                            fogCtx.fillRect(cx - circleR, cy - circleR, circleR * 2, circleR * 2);
                            if (fogFrame) {
                                fogCtx.globalAlpha = 0.4;
                                fogCtx.drawImage(fogFrame, cx - frameSize / 2, cy - frameSize / 2, frameSize, frameSize);
                                fogCtx.globalAlpha = 1;
                            }
                            continue;
                        }

                        if (edgeDist2.has(key)) {
                            const g = fogCtx.createRadialGradient(cx, cy, circleR * 0.6, cx, cy, circleR);
                            g.addColorStop(0, 'rgba(10, 12, 20, 0.94)');
                            g.addColorStop(0.4, 'rgba(10, 12, 20, 0.85)');
                            g.addColorStop(0.7, 'rgba(10, 12, 20, 0.35)');
                            g.addColorStop(1, 'rgba(10, 12, 20, 0)');
                            fogCtx.fillStyle = g;
                            fogCtx.fillRect(cx - circleR, cy - circleR, circleR * 2, circleR * 2);
                            if (fogFrame) {
                                fogCtx.globalAlpha = 0.7;
                                fogCtx.drawImage(fogFrame, cx - frameSize / 2, cy - frameSize / 2, frameSize, frameSize);
                                fogCtx.globalAlpha = 1;
                            }
                            continue;
                        }

                        const g = fogCtx.createRadialGradient(cx, cy, circleR * 0.6, cx, cy, circleR);
                        g.addColorStop(0, 'rgba(10, 12, 20, 0.94)');
                        g.addColorStop(0.4, 'rgba(10, 12, 20, 0.85)');
                        g.addColorStop(0.7, 'rgba(10, 12, 20, 0.35)');
                        g.addColorStop(1, 'rgba(10, 12, 20, 0)');
                        fogCtx.fillStyle = g;
                        fogCtx.fillRect(cx - circleR, cy - circleR, circleR * 2, circleR * 2);
                    }
                }

                fogCtx.restore();

                fogCtx.save();
                fogCtx.globalCompositeOperation = 'destination-out';
                this.drawVisionCutout(fogCtx, playerAbsX, playerAbsY, innerR, outerR, time);
                fogCtx.restore();

                this.ctx.drawImage(this.fogCanvas, 0, 0, viewW, viewH);
            }

            drawRemnants() {
                const camIntX = Math.floor(this.renderCamX);
                const camIntY = Math.floor(this.renderCamY);
                const camFracX = this.renderCamX - camIntX;
                const camFracY = this.renderCamY - camIntY;
                const extraCols = camFracX > 0.001 ? 1 : 0;
                const extraRows = camFracY > 0.001 ? 1 : 0;
                const px = this.map.playerGlobalX;
                const py = this.map.playerGlobalY;

                this.ctx.save();
                this.ctx.translate(this.gridOffsetX - camFracX * this.cellWidth, this.gridOffsetY - camFracY * this.cellHeight);

                for (const r of this.remnants) {
                    if (r.collected) continue;
                    const vx = r.gx - camIntX;
                    const vy = r.gy - camIntY;
                    if (vx < -RENDER_BUFFER || vx >= VIEW_COLS + extraCols + RENDER_BUFFER || vy < -RENDER_BUFFER || vy >= VIEW_ROWS + extraRows + RENDER_BUFFER) continue;

                    const dist = Math.abs(r.gx - px) + Math.abs(r.gy - py);
                    if (this.fogEnabled && dist > this.visionRange && !this.map.seenCells.has(`${r.gy},${r.gx}`)) continue;

                    const cx = vx * this.cellWidth + this.cellWidth / 2;
                    const cy = vy * this.cellHeight + this.cellHeight / 2;
                    const size = Math.min(this.cellWidth, this.cellHeight) * 0.2;
                    const glowSize = size * 1.8;
                    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 800);

                    const gradient = this.ctx.createRadialGradient(cx, cy, size * 0.2, cx, cy, glowSize);
                    gradient.addColorStop(0, 'rgba(140,220,255,0.7)');
                    gradient.addColorStop(0.5, `rgba(80,180,255,${0.35 * pulse})`);
                    gradient.addColorStop(1, 'rgba(40,120,255,0)');
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(cx, cy, glowSize, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.fillStyle = 'rgba(200,240,255,0.85)';
                    this.ctx.shadowColor = 'rgba(130,210,255,0.7)';
                    this.ctx.shadowBlur = 6;
                    this.ctx.beginPath();
                    this.ctx.arc(cx, cy, size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                }

                this.ctx.restore();
            }

            updateUI() {
                const mins = Math.floor(Math.max(0, this.echoCount) / 60);
                const secs = Math.floor(Math.max(0, this.echoCount) % 60);
                document.getElementById('echo-count').textContent =
                    String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                document.getElementById('screen-pos').textContent =
                    `${this.map.playerGlobalX + 1},${this.map.playerGlobalY + 1}`;
                this.updateBoosterUI();
            }

            calcCamera(dt) {
                const deadMinX = Math.floor(VIEW_COLS / 2) - 1;
                const deadMaxX = Math.floor(VIEW_COLS / 2) + 1;
                const deadMinY = Math.floor(VIEW_ROWS / 2) - 1;
                const deadMaxY = Math.floor(VIEW_ROWS / 2) + 1;

                const px = this.playerPixelX / this.cellWidth;
                const py = this.playerPixelY / this.cellHeight;

                const screenX = px - this.camStartX;
                const screenY = py - this.camStartY;

                let targetCamX = this.camStartX;
                let targetCamY = this.camStartY;

                if (screenX < deadMinX) targetCamX = px - deadMinX;
                else if (screenX > deadMaxX) targetCamX = px - deadMaxX;

                if (screenY < deadMinY) targetCamY = py - deadMinY;
                else if (screenY > deadMaxY) targetCamY = py - deadMaxY;

                targetCamX = Math.max(0, Math.min(targetCamX, TOTAL_COLS - VIEW_COLS));
                targetCamY = Math.max(0, Math.min(targetCamY, TOTAL_ROWS - VIEW_ROWS));

                if (!dt || dt <= 0) {
                    this.camStartX = targetCamX;
                    this.camStartY = targetCamY;
                } else {
                    const camSpeed = 12;
                    this.camStartX += (targetCamX - this.camStartX) * Math.min(camSpeed * dt, 1);
                    this.camStartY += (targetCamY - this.camStartY) * Math.min(camSpeed * dt, 1);
                }
            }

            render() {
                const width = this.screenWidth;
                const height = this.screenHeight;
                const camFracX = this.renderCamX - Math.floor(this.renderCamX);
                const camFracY = this.renderCamY - Math.floor(this.renderCamY);
                const camIntX = Math.floor(this.renderCamX);
                const camIntY = Math.floor(this.renderCamY);
                const extraCols = camFracX > 0.001 ? 1 : 0;
                const extraRows = camFracY > 0.001 ? 1 : 0;

                this.ctx.fillStyle = COLORS.fog;
                this.ctx.fillRect(0, 0, width, height);

                this.ctx.save();
                this.ctx.translate(this.gridOffsetX - camFracX * this.cellWidth, this.gridOffsetY - camFracY * this.cellHeight);

                const visibleCells = [];
                for (let vy = -RENDER_BUFFER; vy < VIEW_ROWS + extraRows + RENDER_BUFFER; vy++) {
                    for (let vx = -RENDER_BUFFER; vx < VIEW_COLS + extraCols + RENDER_BUFFER; vx++) {
                        const gx = camIntX + vx;
                        const gy = camIntY + vy;
                        if (gx < 0 || gx >= TOTAL_COLS || gy < 0 || gy >= TOTAL_ROWS) continue;
                        visibleCells.push({
                            gx, gy,
                            cellX: vx * this.cellWidth,
                            cellY: vy * this.cellHeight,
                            cell: this.map.globalGrid[gy][gx]
                        });
                    }
                }

                // Pass 1: 地板层（所有格子，墙体下方也铺地板）
                for (const vc of visibleCells) {
                    const { cell, cellX, cellY, gx, gy } = vc;

                    if (cell === CELL_TYPE.WALL) {
                        this.drawFloorTile(cellX, cellY, this.cellWidth, this.cellHeight,
                            this.selectFloorTile(gx, gy));
                        continue;
                    }

                    if (cell === CELL_TYPE.RUIN) {
                        this.drawRuin(cellX, cellY, gx, gy);
                    } else if (cell === CELL_TYPE.MONUMENT) {
                        this.drawPath(cellX, cellY, gx, gy);
                    } else if (cell === CELL_TYPE.HIGH_COST) {
                        this.drawHighCostTile(cellX, cellY, gx, gy);
                    } else {
                        this.drawPath(cellX, cellY, gx, gy);
                    }
                }

                // Pass 2a: 墙体层（顶面 + 立面，覆盖地板，不含上边缘 tile）
                for (const vc of visibleCells) {
                    if (vc.cell !== CELL_TYPE.WALL) continue;
                    if (this.isTopEdgeCell(vc.gx, vc.gy)) continue;
                    this.drawWall(vc.cellX, vc.cellY, vc.gx, vc.gy);
                }

                // Pass 3: 图标层（宝箱、出口、石碑）
                for (const vc of visibleCells) {
                    const { cell, cellX, cellY, gx, gy } = vc;
                    if (cell === CELL_TYPE.CHEST) {
                        const key = `${gy},${gx}`;
                        const isConditional = this.map.chestConditional && this.map.chestConditional[key];
                        this.drawChest(cellX, cellY, isConditional);
                    } else if (cell === CELL_TYPE.EXIT) {
                        this.drawExit(cellX, cellY);
                    } else if (cell === CELL_TYPE.MONUMENT) {
                        this.drawMonument(cellX, cellY);
                    }
                }

                this.ctx.restore();

                this.drawRemnants();

                this.drawAutoMovePath();

                if (this.petrifying) {
                    this.drawPetrifyingPlayer();
                } else if (this.victoryAnimating) {
                    this.drawPlayer();
                } else {
                    this.drawPlayer();
                }

                // Pass 2b-wall: 上边缘墙体（玩家上层，覆盖玩家形成深度感）
                this.ctx.save();
                this.ctx.translate(this.gridOffsetX - camFracX * this.cellWidth, this.gridOffsetY - camFracY * this.cellHeight);
                for (const vc of visibleCells) {
                    if (vc.cell !== CELL_TYPE.WALL) continue;
                    if (!this.isTopEdgeCell(vc.gx, vc.gy)) continue;
                    this.drawWall(vc.cellX, vc.cellY, vc.gx, vc.gy);
                }
                this.ctx.restore();

                this.drawFog();

                this.renderMinimap();

                if (this.petrifying) {
                    this.drawPetrifyOverlay();
                }
                if (this.victoryAnimating) {
                    this.drawVictoryScene();
                }
            }

            drawWall(x, y, gx, gy) {
                const w = this.cellWidth;
                const h = this.cellHeight;
                const tile = this.selectWallTile(gx, gy);
                if (tile && tile.complete && tile.naturalWidth > 0) {
                    this.ctx.drawImage(tile, x, y, w, h);
                } else {
                    this.ctx.fillStyle = COLORS.wall;
                    this.ctx.fillRect(x, y, w, h);
                    this.ctx.fillStyle = COLORS.wallEdge;
                    this.ctx.fillRect(x, y, w, 3);
                    this.ctx.fillRect(x, y, 3, h);
                    this.ctx.fillStyle = COLORS.wallShadow;
                    this.ctx.fillRect(x + w - 3, y, 3, h);
                    this.ctx.fillRect(x, y + h - 3, w, 3);
                }

                if (this.gridLinesEnabled) {
                    this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
                    this.ctx.lineWidth = 0.5;
                    this.ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
                }
            }

            drawRuin(x, y, gx, gy) {
                const w = this.cellWidth;
                const h = this.cellHeight;

                this.ctx.fillStyle = '#5a4a3a';
                this.ctx.fillRect(x, y, w, h);

                this.ctx.fillStyle = '#4a3a2a';
                this.ctx.fillRect(x + 2, y + 2, w - 4, h - 4);

                this.ctx.fillStyle = '#6b5b4b';
                const crackCount = 3;
                for (let i = 0; i < crackCount; i++) {
                    const startX = x + this.cellWidth * (0.2 + i * 0.25);
                    const startY = y + this.cellHeight * 0.3;
                    this.ctx.beginPath();
                    this.ctx.moveTo(startX, startY);
                    this.ctx.lineTo(startX + (Math.random() - 0.5) * w * 0.4, startY + h * 0.5);
                    this.ctx.strokeStyle = '#7a6a5a';
                    this.ctx.lineWidth = 1;
                    this.ctx.stroke();
                }

                this.ctx.fillStyle = '#8b7b6b';
                this.ctx.fillRect(x + w * 0.35, y + h * 0.6, w * 0.3, h * 0.2);

                if (this.gridLinesEnabled) {
                    this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    this.ctx.lineWidth = 0.5;
                    this.ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
                }
            }

            drawHighCostTile(x, y, gx, gy) {
                const w = this.cellWidth;
                const h = this.cellHeight;

                this.drawFloorTile(x, y, w, h, this.selectFloorTile(gx, gy));

                const gradient = this.ctx.createRadialGradient(
                    x + w / 2, y + h / 2, 0,
                    x + w / 2, y + h / 2, Math.min(w, h) / 2
                );
                gradient.addColorStop(0, 'rgba(255, 180, 80, 0.3)');
                gradient.addColorStop(0.7, 'rgba(255, 120, 40, 0.2)');
                gradient.addColorStop(1, 'rgba(255, 80, 20, 0)');

                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(x, y, w, h);

                this.ctx.fillStyle = 'rgba(255, 150, 50, 0.6)';
                this.ctx.font = `${Math.min(w, h) * 0.35}px sans-serif`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText('⚠', x + w / 2, y + h / 2);

                if (this.gridLinesEnabled) {
                    this.ctx.strokeStyle = 'rgba(60, 45, 30, 0.15)';
                    this.ctx.lineWidth = 0.5;
                    this.ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
                }
            }

            drawMonument(x, y) {
                const w = this.cellWidth;
                const h = this.cellHeight;
                const cx = x + w / 2;
                const cy = y + h / 2;

                this.ctx.fillStyle = '#7a7a8a';
                const baseWidth = w * 0.4;
                const baseHeight = h * 0.5;
                this.ctx.fillRect(cx - baseWidth / 2, cy - baseHeight / 2, baseWidth, baseHeight);

                this.ctx.fillStyle = '#8a8a9a';
                const topWidth = w * 0.25;
                const topHeight = h * 0.3;
                this.ctx.fillRect(cx - topWidth / 2, cy - baseHeight / 2 - topHeight, topWidth, topHeight);

                this.ctx.fillStyle = '#9a9aaa';
                const peakWidth = w * 0.1;
                const peakHeight = h * 0.15;
                this.ctx.beginPath();
                this.ctx.moveTo(cx - peakWidth / 2, cy - baseHeight / 2 - topHeight);
                this.ctx.lineTo(cx, cy - baseHeight / 2 - topHeight - peakHeight);
                this.ctx.lineTo(cx + peakWidth / 2, cy - baseHeight / 2 - topHeight);
                this.ctx.fill();

                this.ctx.fillStyle = '#6a6a7a';
                this.ctx.fillRect(cx - baseWidth / 2 + 3, cy - baseHeight / 2 + 3, baseWidth - 6, baseHeight - 6);

                this.ctx.fillStyle = '#4a4a5a';
                this.ctx.font = `${Math.min(w, h) * 0.15}px serif`;
                this.ctx.textAlign = 'center';
                this.ctx.fillText('✧', cx, cy - baseHeight / 4);
            }

            drawPath(x, y, gx, gy) {
                const w = this.cellWidth;
                const h = this.cellHeight;

                this.drawFloorTile(x, y, w, h, this.selectFloorTile(gx, gy));

                if (this.gridLinesEnabled) {
                    this.ctx.strokeStyle = 'rgba(60, 45, 30, 0.15)';
                    this.ctx.lineWidth = 0.5;
                    this.ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
                }
            }

            drawChest(x, y, isConditional) {
                const w = this.cellWidth;
                const h = this.cellHeight;
                const cx = x + w / 2;
                const cy = y + h / 2;
                const size = Math.min(w, h) * 0.35;

                const glowColor = isConditional ? 'rgba(180, 130, 255, 0.8)' : COLORS.chestGlow;
                const chestColor = isConditional ? '#9b7fd4' : COLORS.chest;

                this.ctx.shadowColor = glowColor;
                this.ctx.shadowBlur = 15;
                this.ctx.fillStyle = chestColor;
                this.ctx.fillRect(cx - size, cy - size * 0.6, size * 2, size * 1.2);
                this.ctx.shadowBlur = 0;

                this.ctx.fillStyle = isConditional ? '#c4b5e8' : COLORS.chestGlow;
                this.ctx.fillRect(cx - 3, cy - size * 0.3, 6, size * 0.6);

                if (isConditional) {
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = `${size * 0.8}px sans-serif`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('🔒', cx, cy - size * 0.9);
                }
            }

            drawExit(x, y) {
                const w = this.cellWidth;
                const h = this.cellHeight;
                const cx = x + w / 2;
                const cy = y + h / 2;
                const size = Math.min(w, h) * 0.4;

                this.ctx.shadowColor = COLORS.exitGlow;
                this.ctx.shadowBlur = 20;
                this.ctx.fillStyle = COLORS.exit;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, size, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;

                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy - size * 0.5);
                this.ctx.lineTo(cx, cy + size * 0.5);
                this.ctx.moveTo(cx - size * 0.5, cy);
                this.ctx.lineTo(cx + size * 0.5, cy);
                this.ctx.stroke();
            }

            drawPlayer() {
                const x = this.gridOffsetX + this.playerPixelX - this.camStartX * this.cellWidth;
                const y = this.gridOffsetY + this.playerPixelY - this.camStartY * this.cellHeight;
                
                const scale = Math.min(this.cellWidth, this.cellHeight) / 40 * this.playerScale;
                
                let charWidth, charHeight, pivotOffset;
                let isLR = false;
                
                const animations = this.playerAnimations;
                let frames;
                
                if (this.playerIsMoving) {
                    frames = animations[this.playerDirection] || animations.down;
                    isLR = this.playerDirection === 'left' || this.playerDirection === 'right';
                    charWidth = isLR ? this.characterWidthLR * scale : this.characterWidth * scale;
                } else {
                    frames = animations.standby;
                    charWidth = this.characterWidth * scale;
                }
                
                charHeight = this.characterHeight * scale;
                pivotOffset = this.characterPivotY * scale;
                
                const drawX = x - charWidth / 2;
                const drawY = y - pivotOffset;

                this.ctx.shadowColor = COLORS.playerGlow;
                this.ctx.shadowBlur = 20;
                
                const frame = frames[Math.floor(this.playerFrameIndex)];
                
                if (frame && frame.complete) {
                    if (this.playerDirection === 'right') {
                        this.ctx.save();
                        this.ctx.translate(drawX + charWidth / 2, drawY + charHeight / 2);
                        this.ctx.scale(-1, 1);
                        this.ctx.drawImage(frame, -charWidth / 2, -charHeight / 2, charWidth, charHeight);
                        this.ctx.restore();
                    } else {
                        this.ctx.drawImage(frame, drawX, drawY, charWidth, charHeight);
                    }
                } else {
                    this.ctx.fillStyle = COLORS.player;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, Math.min(this.cellWidth, this.cellHeight) * 0.3 * this.playerScale, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                
                this.ctx.shadowBlur = 0;
            }

            updatePlayerAnimation(dt) {
                if (this.playerIsMoving) {
                    this.playerAnimationTimer += dt * 1000;
                    const frameTime = 1000 / this.playerAnimationSpeed;
                    this.playerFrameIndex = (this.playerAnimationTimer / frameTime) % 6;
                } else {
                    this.playerAnimationTimer += dt * 1000;
                    const frameTime = 1500 / 3;
                    this.playerFrameIndex = Math.floor((this.playerAnimationTimer / frameTime) % 3);
                }
            }

            updateFogAnimation(dt) {
                if (!this.fogAnimations || this.fogAnimations.length === 0) return;
                this.fogFrameTimer += dt * 1000;
                const frameTime = 1000 / this.fogFrameSpeed;
                this.fogFrameIndex = Math.floor((this.fogFrameTimer / frameTime) % this.fogAnimations.length);
            }

            renderMinimap() {
                const mw = 100;
                const mh = 100;
                const cellW = mw / TOTAL_COLS;
                const cellH = mh / TOTAL_ROWS;

                if (this.fogEnabled) {
                    this.minimapCtx.fillStyle = COLORS.fog;
                    this.minimapCtx.fillRect(0, 0, mw, mh);
                } else {
                    this.minimapCtx.fillStyle = '#1a1a1a';
                    this.minimapCtx.fillRect(0, 0, mw, mh);
                    for (let gy = 0; gy < TOTAL_ROWS; gy++) {
                        for (let gx = 0; gx < TOTAL_COLS; gx++) {
                            const cell = this.map.globalGrid[gy][gx];
                            if (cell === CELL_TYPE.WALL) {
                                this.minimapCtx.fillStyle = '#2a2a2a';
                                this.minimapCtx.fillRect(gx * cellW, gy * cellH, cellW, cellH);
                            } else if (cell === CELL_TYPE.PATH || cell === CELL_TYPE.RUIN || cell === CELL_TYPE.HIGH_COST) {
                                this.minimapCtx.fillStyle = '#3a3a3a';
                                this.minimapCtx.fillRect(gx * cellW, gy * cellH, cellW, cellH);
                            } else if (cell === CELL_TYPE.EXIT) {
                                this.minimapCtx.fillStyle = '#00ff00';
                                this.minimapCtx.fillRect(gx * cellW, gy * cellH, cellW, cellH);
                            } else if (cell === CELL_TYPE.CHEST) {
                                this.minimapCtx.fillStyle = COLORS.chest;
                                this.minimapCtx.fillRect(gx * cellW, gy * cellH, cellW, cellH);
                            } else if (cell === CELL_TYPE.MONUMENT) {
                                this.minimapCtx.fillStyle = '#6666aa';
                                this.minimapCtx.fillRect(gx * cellW, gy * cellH, cellW, cellH);
                            }
                        }
                    }
                }

                const memoryRange = 1 + (this.memoryLevel || 0);
                const treasureRange = 1 + (this.treasureVisibility || 0);

                if (this.fogEnabled) {
                    for (const key of this.map.seenCells) {
                        const [gy, gx] = key.split(',').map(Number);
                        const cell = this.map.globalGrid[gy][gx];
                        if (cell === CELL_TYPE.WALL) {
                            this.minimapCtx.fillStyle = '#444';
                        } else if (cell === CELL_TYPE.PATH || cell === CELL_TYPE.RUIN || cell === CELL_TYPE.HIGH_COST) {
                            this.minimapCtx.fillStyle = '#666';
                        } else if (cell === CELL_TYPE.CHEST) {
                            this.minimapCtx.fillStyle = COLORS.chest;
                        } else if (cell === CELL_TYPE.EXIT) {
                            this.minimapCtx.fillStyle = COLORS.exit;
                        } else if (cell === CELL_TYPE.MONUMENT) {
                            this.minimapCtx.fillStyle = '#8888cc';
                        } else {
                            this.minimapCtx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                        }
                        this.minimapCtx.fillRect(gx * cellW, gy * cellH, cellW, cellH);
                    }
                }

                if (this.treasureVisibility > 0) {
                    for (let gy = 0; gy < TOTAL_ROWS; gy++) {
                        for (let gx = 0; gx < TOTAL_COLS; gx++) {
                            if (this.map.globalGrid[gy][gx] !== CELL_TYPE.CHEST) continue;
                            const dist = Math.max(
                                Math.abs(gx - this.map.playerGlobalX),
                                Math.abs(gy - this.map.playerGlobalY)
                            );
                            const maxDist = treasureRange * VIEW_COLS;
                            if (dist <= maxDist) {
                                this.minimapCtx.fillStyle = COLORS.chest;
                                this.minimapCtx.fillRect(
                                    gx * cellW - 0.5,
                                    gy * cellH - 0.5,
                                    1, 1
                                );
                            }
                        }
                    }
                }

                const px = this.map.playerGlobalX * cellW + cellW / 2;
                const py = this.map.playerGlobalY * cellH + cellH / 2;

                this.minimapCtx.fillStyle = COLORS.player;
                this.minimapCtx.beginPath();
                this.minimapCtx.arc(px, py, 2, 0, Math.PI * 2);
                this.minimapCtx.fill();
            }

            showBackpack() {
                const title = document.getElementById('overlay-title');
                title.textContent = '背包';

                document.getElementById('overlay-body').innerHTML = `
                    <div class="capsule-grid" id="capsule-grid"></div>
                    <div class="empty-hint" id="overlay-hint">点击追忆使用</div>
                `;

                const grid = document.getElementById('capsule-grid');

                grid.innerHTML = '';

                this.capsules.forEach((capsule, index) => {
                    const def = CapsuleHelper.getById(capsule.id);
                    const slot = document.createElement('div');
                    slot.className = 'capsule-slot filled';
                    slot.style.position = 'relative';
                    slot.innerHTML = `
                        <div style="font-size:28px;">${def ? def.icon : '❓'}</div>
                        <div style="font-size:9px;color:var(--text-secondary);margin-top:2px;">${def ? def.name : capsule.id}</div>
                    `;
                    if (def && def.category === 'persistent') {
                        const badge = document.createElement('div');
                        badge.style.cssText = 'position:absolute;top:2px;right:2px;background:#4ade80;color:#000;font-size:8px;padding:1px 4px;border-radius:4px;';
                        badge.textContent = '被动';
                        slot.appendChild(badge);
                    }
                    slot.addEventListener('click', () => this.useCapsule(index));
                    grid.appendChild(slot);
                });

                for (let i = this.capsules.length; i < BACKPACK_CAPACITY; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'capsule-slot';
                    grid.appendChild(slot);
                }

                document.getElementById('overlay').classList.add('active');
                document.getElementById('overlay-close').style.display = '';
            }

            useCapsule(index) {
                if (index >= this.capsules.length) return;

                const capsule = this.capsules[index];
                const def = CapsuleHelper.getById(capsule.id);
                if (!def) return;

                if (def.category === 'persistent') {
                    this.hideOverlay();
                    return;
                }

                switch (def.id) {
                    case 'capsule_echo_small':
                        this.echoCount = Math.min(this.echoCount + 15, this.echoCapacity);
                        this.capsules.splice(index, 1);
                        this.updateUI();
                        this.render();
                        this.showBackpack();
                        break;
                    case 'capsule_light_up':
                        this.capsules.splice(index, 1);
                        this.hideOverlay();
                        this.enterRevealMode();
                        break;
                    case 'capsule_void_step':
                        this.capsules.splice(index, 1);
                        this.hideOverlay();
                        this.enterVoidStepMode();
                        break;
                    case 'capsule_magnetic_glove':
                        this.hideOverlay();
                        if (!this.enterMagneticGloveMode()) {
                            this.showBackpack();
                            break;
                        }
                        this.capsules.splice(index, 1);
                        break;
                    default:
                        this.hideOverlay();
                        break;
                }
            }

            enterRevealMode() {
                this.chestOpenMode = 'reveal';
                const hint = document.createElement('div');
                hint.id = 'reveal-hint';
                hint.textContent = '点击残响记忆选择要照亮的区域';
                hint.style.cssText = 'position:fixed;bottom:140px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,0.8);padding:8px 16px;border-radius:20px;font-size:13px;z-index:100;';
                document.body.appendChild(hint);

                this.minimap.style.pointerEvents = 'auto';
                this.minimap.style.cursor = 'crosshair';

                const handler = (e) => {
                    const rect = this.minimap.getBoundingClientRect();
                    const mx = (e.clientX - rect.left) / rect.width * TOTAL_COLS;
                    const my = (e.clientY - rect.top) / rect.height * TOTAL_ROWS;
                    const gx = Math.floor(mx);
                    const gy = Math.floor(my);

                    const revealRadius = Math.floor(VIEW_COLS / 2);
                    for (let rgy = gy - revealRadius; rgy <= gy + revealRadius; rgy++) {
                        for (let rgx = gx - revealRadius; rgx <= gx + revealRadius; rgx++) {
                            if (rgx >= 0 && rgx < TOTAL_COLS && rgy >= 0 && rgy < TOTAL_ROWS) {
                                this.map.markExplored(rgy, rgx);
                            }
                        }
                    }

                    this.minimap.removeEventListener('click', handler);
                    this.minimap.style.pointerEvents = 'none';
                    this.minimap.style.cursor = '';
                    const h = document.getElementById('reveal-hint');
                    if (h) h.remove();
                    this.chestOpenMode = null;
                    this.render();
                };

                this.minimap.addEventListener('click', handler);
            }

            enterVoidStepMode() {
                this.chestOpenMode = 'voidStep';
                const hint = document.createElement('div');
                hint.id = 'void-step-hint';
                hint.textContent = '点击目标位置进行虚空步传送(最远3格)';
                hint.style.cssText = 'position:fixed;bottom:140px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,0.8);padding:8px 16px;border-radius:20px;font-size:13px;z-index:100;';
                document.body.appendChild(hint);

                this.render();
                this.highlightVoidStepTargets();

                const handler = (e) => {
                    const rect = this.scrollContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;

                    const vx = Math.floor((clickX - this.gridOffsetX) / this.cellWidth);
                    const vy = Math.floor((clickY - this.gridOffsetY) / this.cellHeight);
                    const gx = this.camStartX + vx;
                    const gy = this.camStartY + vy;

                    const dist = Math.abs(gx - this.map.playerGlobalX) + Math.abs(gy - this.map.playerGlobalY);
                    if (dist > 3 || dist === 0) return;

                    if (gx < 0 || gx >= TOTAL_COLS || gy < 0 || gy >= TOTAL_ROWS) return;
                    if (this.map.globalGrid[gy][gx] === CELL_TYPE.WALL) return;

                    this.map.playerGlobalX = gx;
                    this.map.playerGlobalY = gy;
                    this.map.markExplored(gy, gx);

                    this.canvas.removeEventListener('click', handler);
                    const h = document.getElementById('void-step-hint');
                    if (h) h.remove();
                    this.chestOpenMode = null;
                    this.calcCamera(0);
                    this.updateScreenPos();
                    this.render();
                    this.checkChestCollision();
                };

                this.canvas.addEventListener('click', handler);
            }

            highlightVoidStepTargets() {
                const px = this.map.playerGlobalX;
                const py = this.map.playerGlobalY;

                for (let dy = -3; dy <= 3; dy++) {
                    for (let dx = -3; dx <= 3; dx++) {
                        const dist = Math.abs(dx) + Math.abs(dy);
                        if (dist > 3 || dist === 0) continue;
                        const gx = px + dx;
                        const gy = py + dy;
                        if (gx < 0 || gx >= TOTAL_COLS || gy < 0 || gy >= TOTAL_ROWS) continue;
                        if (this.map.globalGrid[gy][gx] === CELL_TYPE.WALL) continue;

                        const vx = gx - this.camStartX;
                        const vy = gy - this.camStartY;
                        if (vx < 0 || vx >= VIEW_COLS || vy < 0 || vy >= VIEW_ROWS) continue;

                        const hx = this.gridOffsetX + vx * this.cellWidth;
                        const hy = this.gridOffsetY + vy * this.cellHeight;
                        this.ctx.fillStyle = 'rgba(0, 200, 255, 0.3)';
                        this.ctx.fillRect(hx, hy, this.cellWidth, this.cellHeight);
                        this.ctx.strokeStyle = 'rgba(0, 200, 255, 0.6)';
                        this.ctx.lineWidth = 2;
                        this.ctx.strokeRect(hx, hy, this.cellWidth, this.cellHeight);
                    }
                }
            }

            enterMagneticGloveMode() {
                const chests = [];
                for (let vy = 0; vy < VIEW_ROWS; vy++) {
                    for (let vx = 0; vx < VIEW_COLS; vx++) {
                        const gx = this.camStartX + vx;
                        const gy = this.camStartY + vy;
                        if (this.map.globalGrid[gy][gx] === CELL_TYPE.CHEST) {
                            chests.push({ gx, gy, vx, vy });
                        }
                    }
                }

                if (chests.length === 0) return false;

                if (chests.length === 1) {
                    this.pullChestToPlayerGlobal(chests[0]);
                    this.render();
                    return true;
                }

                this.chestOpenMode = 'magneticGlove';
                const hint = document.createElement('div');
                hint.id = 'magnetic-hint';
                hint.textContent = '点击记忆匣将其吸到面前';
                hint.style.cssText = 'position:fixed;bottom:140px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,0.8);padding:8px 16px;border-radius:20px;font-size:13px;z-index:100;';
                document.body.appendChild(hint);

                this.render();
                this.highlightChestsOnScreenGlobal(chests);

                const handler = (e) => {
                    const rect = this.scrollContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;

                    const vx = Math.floor((clickX - this.gridOffsetX) / this.cellWidth);
                    const vy = Math.floor((clickY - this.gridOffsetY) / this.cellHeight);
                    const gx = this.camStartX + vx;
                    const gy = this.camStartY + vy;

                    const target = chests.find(c => c.gx === gx && c.gy === gy);
                    if (!target) return;

                    this.pullChestToPlayerGlobal(target);

                    this.canvas.removeEventListener('click', handler);
                    const h = document.getElementById('magnetic-hint');
                    if (h) h.remove();
                    this.chestOpenMode = null;
                    this.render();
                };

                this.canvas.addEventListener('click', handler);
                return true;
            }

            highlightChestsOnScreenGlobal(chests) {
                for (const chest of chests) {
                    const hx = this.gridOffsetX + chest.vx * this.cellWidth;
                    const hy = this.gridOffsetY + chest.vy * this.cellHeight;
                    this.ctx.fillStyle = 'rgba(201, 162, 39, 0.4)';
                    this.ctx.fillRect(hx, hy, this.cellWidth, this.cellHeight);
                    this.ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(hx, hy, this.cellWidth, this.cellHeight);
                }
            }

            pullChestToPlayerGlobal(chest) {
                const px = this.map.playerGlobalX;
                const py = this.map.playerGlobalY;

                const dx = chest.gx - px;
                const dy = chest.gy - py;

                let tx = px;
                let ty = py;
                if (Math.abs(dx) >= Math.abs(dy)) {
                    tx = px + (dx > 0 ? 1 : -1);
                } else {
                    ty = py + (dy > 0 ? 1 : -1);
                }

                if (tx >= 0 && tx < TOTAL_COLS && ty >= 0 && ty < TOTAL_ROWS && this.map.globalGrid[ty][tx] === CELL_TYPE.PATH) {
                    this.map.globalGrid[chest.gy][chest.gx] = CELL_TYPE.PATH;
                    this.map.globalGrid[ty][tx] = CELL_TYPE.CHEST;

                    const oldKey = `${chest.gy},${chest.gx}`;
                    const newKey = `${ty},${tx}`;
                    if (this.map.chestConditional && this.map.chestConditional[oldKey]) {
                        this.map.chestConditional[newKey] = true;
                        delete this.map.chestConditional[oldKey];
                    }
                }
            }

            showVictory() {
                this.gameOver = true;
                this.warehouse.depositRun(this.capsules);

                const title = document.getElementById('overlay-title');
                title.textContent = '胜利';
                document.getElementById('overlay-body').innerHTML = `
                    <div class="victory-overlay">
                        <div class="victory-icon">🏆</div>
                        <div class="victory-text">胜利!</div>
                        <div class="victory-sub">你找到了光之尽头!</div>
                        <div style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">
                            背包中的 ${this.capsules.length} 件追忆已存入仓库
                        </div>
                        <button class="restart-btn" id="victory-restart-btn">再次入梦</button>
                    </div>
                `;
                document.getElementById('overlay').classList.add('active');
                document.getElementById('overlay-close').style.display = 'none';

                document.getElementById('victory-restart-btn').addEventListener('click', () => {
                    this.stopAnimationLoop();
                    this.stopBGM();
                    this.hideOverlay();
                    document.getElementById('overlay-close').style.display = '';
                    showPreGameSelection();
                });
            }

            startPetrifyAnimation() {
                this.petrifying = true;
                this.petrifyPhase = 0;
                this.petrifyStartTime = performance.now();
                this.petrifyPhaseStart = performance.now();
                this.stopAnimationLoop();
                this.startAnimationLoop();
            }

            updatePetrify(timestamp) {
                const phaseElapsed = timestamp - this.petrifyPhaseStart;

                if (this.petrifyPhase === 0) {
                    if (phaseElapsed >= 500) {
                        this.petrifyPhase = 1;
