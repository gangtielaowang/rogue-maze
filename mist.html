                        this.petrifyPhaseStart = timestamp;
                    }
                } else if (this.petrifyPhase === 1) {
                    this.stoneProgress = Math.min(1, phaseElapsed / 1500);
                    if (this.stoneProgress >= 1) {
                        this.petrifyPhase = 2;
                        this.petrifyPhaseStart = timestamp;
                    }
                } else if (this.petrifyPhase === 2) {
                    this.darkenProgress = Math.min(1, phaseElapsed / 800);
                    if (this.darkenProgress >= 1) {
                        this.petrifyPhase = 3;
                        this.petrifyPhaseStart = timestamp;
                    }
                } else if (this.petrifyPhase === 3) {
                    if (phaseElapsed >= 2000) {
                        this.petrifying = false;
                        this.showGameOver();
                    }
                }
            }

            drawPetrifyingPlayer() {
                const x = this.gridOffsetX + this.playerPixelX - this.camStartX * this.cellWidth;
                const y = this.gridOffsetY + this.playerPixelY - this.camStartY * this.cellHeight;
                const radius = Math.min(this.cellWidth, this.cellHeight) * 0.3 * this.playerScale;

                if (this.petrifyPhase === 0) {
                    this.ctx.shadowColor = COLORS.playerGlow;
                    this.ctx.shadowBlur = 25;
                    this.ctx.fillStyle = COLORS.player;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;

                    this.ctx.fillStyle = '#fff';
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, radius * 0.3, 0, Math.PI * 2);
                    this.ctx.fill();
                    return;
                }

                const progress = this.stoneProgress || 0;
                const stoneY = y + radius - progress * radius * 2;
                const stoneColor = '#7a7a7a';
                const livingColor = COLORS.player;

                this.ctx.shadowColor = COLORS.playerGlow;
                this.ctx.shadowBlur = 25 * (1 - progress);

                this.ctx.fillStyle = livingColor;
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.rect(x - radius - 2, stoneY, radius * 2 + 4, y + radius - stoneY + 2);
                this.ctx.clip();

                this.ctx.fillStyle = stoneColor;
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.strokeStyle = '#5a5a5a';
                this.ctx.lineWidth = 1.5;
                for (let i = 0; i < 5; i++) {
                    const cx = x - radius + (Math.sin(i * 1.7 + progress * 3) * 0.5 + 0.5) * radius * 2;
                    const cy = y + radius - progress * radius * 2 + (i / 5) * progress * radius * 2;
                    const clen = radius * 0.2 + Math.random() * radius * 0.3;
                    const cang = (i / 5) * Math.PI * 0.6 + 0.3;
                    this.ctx.beginPath();
                    this.ctx.moveTo(cx, cy);
                    this.ctx.lineTo(cx + Math.cos(cang) * clen, cy + Math.sin(cang) * clen);
                    this.ctx.stroke();
                }

                this.ctx.restore();
                this.ctx.shadowBlur = 0;

                const innerProgress = Math.max(0, progress - 0.3) / 0.7;
                const innerColor = `rgb(${Math.round(255 - 133 * innerProgress)},${Math.round(255 - 133 * innerProgress)},${Math.round(255 - 133 * innerProgress)})`;
                this.ctx.fillStyle = innerColor;
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius * 0.3, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawPetrifyOverlay() {
                const w = this.screenWidth;
                const h = this.screenHeight;

                if (this.petrifyPhase >= 2) {
                    const dp = this.darkenProgress || 0;
                    const gradient = this.ctx.createRadialGradient(w / 2, h / 2, w * 0.3 * (1 - dp), w / 2, h / 2, Math.max(w, h) * 0.8);
                    gradient.addColorStop(0, 'rgba(0,0,0,0)');
                    gradient.addColorStop(1, `rgba(0,0,0,${0.85 * dp})`);
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(0, 0, w, h);
                }

                if (this.petrifyPhase >= 3) {
                    const tp = Math.min(1, (performance.now() - this.petrifyPhaseStart) / 1000);
                    this.ctx.fillStyle = `rgba(200,200,200,${0.9 * tp})`;
                    this.ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('你回头望向黑暗，却看到了自己石化的面容。', w / 2, h / 2);
                }
            }

            startVictoryAnimation() {
                this.victoryAnimating = true;
                this.victoryPhase = 0;
                this.victoryPhaseStart = performance.now();
                this.victoryParticles = [];
                this.stopAnimationLoop();
                this.startAnimationLoop();
            }

            updateVictory(timestamp) {
                const elapsed = timestamp - this.victoryPhaseStart;

                if (this.victoryPhase === 0) {
                    if (elapsed >= 600) {
                        this.victoryPhase = 1;
                        this.victoryPhaseStart = timestamp;
                    }
                } else if (this.victoryPhase === 1) {
                    this.victoryPhaseProgress = Math.min(1, elapsed / 2000);
                    if (this.victoryPhaseProgress >= 1) {
                        this.victoryPhase = 2;
                        this.victoryPhaseStart = timestamp;
                    }
                } else if (this.victoryPhase === 2) {
                    this.victoryPhaseProgress = Math.min(1, elapsed / 1500);
                    this.generateDissolveParticles(timestamp);
                    this.updateDissolveParticles(timestamp);
                    if (this.victoryPhaseProgress >= 1) {
                        this.victoryPhase = 3;
                        this.victoryPhaseStart = timestamp;
                    }
                } else if (this.victoryPhase === 3) {
                    this.victoryPhaseProgress = Math.min(1, elapsed / 800);
                    if (this.victoryPhaseProgress >= 1) {
                        this.victoryPhase = 4;
                        this.victoryPhaseStart = timestamp;
                    }
                } else if (this.victoryPhase === 4) {
                    if (elapsed >= 2500) {
                        this.victoryAnimating = false;
                        this.showVictory();
                    }
                }
            }

            generateDissolveParticles(timestamp) {
                if (!this._lastParticleGen) this._lastParticleGen = 0;
                if (timestamp - this._lastParticleGen < 50) return;
                this._lastParticleGen = timestamp;

                const exitSx = this.gridOffsetX + (this.map.exitGlobalX - this.renderCamX) * this.cellWidth + this.cellWidth / 2;
                const exitSy = this.gridOffsetY + (this.map.exitGlobalY - this.renderCamY) * this.cellHeight + this.cellHeight / 2;

                for (let i = 0; i < 3; i++) {
                    this.victoryParticles.push({
                        x: exitSx + (Math.random() - 0.5) * this.cellWidth * 1.2,
                        y: exitSy + (Math.random() - 0.5) * this.cellHeight * 1.5,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3 - 0.2,
                        life: 1,
                        decay: 0.005 + Math.random() * 0.015,
                        size: 1.5 + Math.random() * 2.5
                    });
                }
            }

            updateDissolveParticles(timestamp) {
                this.victoryParticles = this.victoryParticles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    return p.life > 0;
                });
            }

            drawVictoryScene() {
                const w = this.screenWidth;
                const h = this.screenHeight;
                const exitSx = this.gridOffsetX + (this.map.exitGlobalX - this.renderCamX) * this.cellWidth + this.cellWidth / 2;
                const exitSy = this.gridOffsetY + (this.map.exitGlobalY - this.renderCamY) * this.cellHeight + this.cellHeight / 2;

                if (this.victoryPhase === 0) {
                    const p = Math.min(1, (performance.now() - this.victoryPhaseStart) / 600);
                    this.ctx.fillStyle = `rgba(255,215,0,${0.3 * p})`;
                    this.ctx.fillRect(0, 0, w, h);
                    return;
                }

                if (this.victoryPhase >= 1) {
                    const glow = this.victoryPhase < 2 ? 0.6 : 0.6 * (1 - this.victoryPhaseProgress);
                    const radialGrad = this.ctx.createRadialGradient(exitSx, exitSy, 0, exitSx, exitSy, this.cellWidth * 2);
                    radialGrad.addColorStop(0, `rgba(255,215,0,${0.4 * glow})`);
                    radialGrad.addColorStop(0.5, `rgba(255,215,0,${0.15 * glow})`);
                    radialGrad.addColorStop(1, 'rgba(255,215,0,0)');
                    this.ctx.fillStyle = radialGrad;
                    this.ctx.fillRect(exitSx - this.cellWidth * 2, exitSy - this.cellWidth * 2, this.cellWidth * 4, this.cellWidth * 4);
                }

                if (this.victoryPhase >= 1 && this.victoryPhase < 3) {
                    this.drawSilhouette(exitSx, exitSy);
                }

                if (this.victoryPhase >= 2) {
                    this.drawParticles();
                }

                if (this.victoryPhase >= 3) {
                    const p = this.victoryPhaseProgress;
                    this.ctx.fillStyle = `rgba(255,215,0,${0.5 * p})`;
                    this.ctx.fillRect(0, 0, w, h);

                    const tp = this.victoryPhase >= 4
                        ? Math.min(1, (performance.now() - this.victoryPhaseStart) / 1000)
                        : 0;
                    this.ctx.fillStyle = `rgba(255,255,255,${0.9 * tp})`;
                    this.ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('你触碰了那道光，满墙的回音汇成了她的声音：', w / 2, h / 2 - 14);
                    this.ctx.fillText('"你终于来了。"', w / 2, h / 2 + 14);
                }
            }

            drawSilhouette(cx, cy) {
                const ch = this.cellHeight;
                const hh = ch * 0.25;
                const bw = ch * 0.22;
                const alpha = this.victoryPhase < 2 ? this.victoryPhaseProgress : 1 - this.victoryPhaseProgress;

                this.ctx.save();
                this.ctx.globalAlpha = alpha;
                this.ctx.fillStyle = '#2a1a0a';
                this.ctx.strokeStyle = '#c8a84a';
                this.ctx.lineWidth = 1.2;

                this.ctx.beginPath();
                this.ctx.arc(cx, cy - ch * 0.32, hh * 0.38, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.stroke();

                this.ctx.beginPath();
                this.ctx.moveTo(cx - bw * 0.15, cy - ch * 0.22);
                this.ctx.quadraticCurveTo(cx - bw * 0.5, cy - ch * 0.25, cx - bw * 0.55, cy - ch * 0.05);
                this.ctx.lineTo(cx - bw * 0.6, cy + ch * 0.12);
                this.ctx.lineTo(cx + bw * 0.6, cy + ch * 0.12);
                this.ctx.lineTo(cx + bw * 0.55, cy - ch * 0.05);
                this.ctx.quadraticCurveTo(cx + bw * 0.5, cy - ch * 0.25, cx + bw * 0.15, cy - ch * 0.22);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();

                this.ctx.restore();
            }

            drawParticles() {
                for (const p of this.victoryParticles) {
                    this.ctx.fillStyle = `rgba(255,215,0,${p.life})`;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            showGameOver() {
                this.gameOver = true;

                if (this.capsules.length > 0) {
                    this.showDeathRetention();
                } else {
                    this.showGameOverFinal();
                }
            }

            showDeathRetention() {
                this.deathRetentionMode = true;
                const keepCount = Math.max(0, this.capsules.length - 1);
                const selected = new Set();

                const renderRetention = () => {
                    const title = document.getElementById('overlay-title');
                    title.textContent = '回音耗尽';
                    document.getElementById('overlay-body').innerHTML = `
                        <div class="victory-overlay">
                            <div class="victory-icon">🔥</div>
                            <div class="victory-text" style="color: #ff6b35;">回音耗尽</div>
                            <div class="victory-sub">你在黑暗中迷失了方向...</div>
                            <div style="color:var(--text-secondary);font-size:13px;margin-bottom:8px;">
                                你可以保留 ${keepCount} 件追忆带回仓库
                            </div>
                            <div id="retention-options" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
                            <button class="restart-btn" id="retention-confirm-btn" ${selected.size !== keepCount ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>确认保留</button>
                        </div>
                    `;
                    document.getElementById('overlay').classList.add('active');
                    document.getElementById('overlay-close').style.display = 'none';

                    const optionsDiv = document.getElementById('retention-options');
                    this.capsules.forEach((cap, idx) => {
                        const def = CapsuleHelper.getById(cap.id);
                        const isSelected = selected.has(idx);
                        const btn = document.createElement('button');
                        btn.className = 'restart-btn';
                        btn.style.cssText = `font-size:13px;padding:10px 16px;${isSelected ? 'background:rgba(74,222,128,0.3);border:1px solid #4ade80;' : 'background:rgba(255,255,255,0.1);'}box-shadow:none;`;
                        btn.textContent = `${def ? def.icon + ' ' + def.name : cap.id} ${isSelected ? '✓' : ''}`;
                        btn.addEventListener('click', () => {
                            if (isSelected) {
                                selected.delete(idx);
                            } else if (selected.size < keepCount) {
                                selected.add(idx);
                            }
                            renderRetention();
                        });
                        optionsDiv.appendChild(btn);
                    });

                    if (selected.size === keepCount) {
                        document.getElementById('retention-confirm-btn').addEventListener('click', () => {
                            const kept = [];
                            this.capsules.forEach((cap, idx) => {
                                if (selected.has(idx)) {
                                    kept.push(cap);
                                }
                            });
                            for (const cap of kept) {
                                this.warehouse.add(cap.id, 1);
                            }
                            this.capsules = [];
                            this.showGameOverFinal();
                        });
                    }
                };

                renderRetention();
            }

            showGameOverFinal() {
                const title = document.getElementById('overlay-title');
                title.textContent = '回音耗尽';
                document.getElementById('overlay-body').innerHTML = `
                    <div class="victory-overlay">
                        <div class="victory-icon">🔥</div>
                        <div class="victory-text" style="color: #ff6b35;">回音耗尽</div>
                        <div class="victory-sub">你在黑暗中迷失了方向...</div>
                        <button class="restart-btn" id="gameover-restart-btn">再次入梦</button>
                    </div>
                `;
                document.getElementById('overlay').classList.add('active');
                document.getElementById('overlay-close').style.display = 'none';

                document.getElementById('gameover-restart-btn').addEventListener('click', () => {
                    this.stopAnimationLoop();
                    this.stopBGM();
                    this.hideOverlay();
                    document.getElementById('overlay-close').style.display = '';
                    showPreGameSelection();
                });
            }

            hideOverlay() {
                document.getElementById('overlay').classList.remove('active');
            }

            restart() {
                this.stopAnimationLoop();
                this.stopBGM();
                this.hideOverlay();
                document.getElementById('overlay-close').style.display = '';
                showPreGameSelection();
            }

            restartWithConfig(config) {
                this.stopAnimationLoop();
                
                this.map = new GameMapFree(config);
                this.generateRemnants();
                
                this.echoCount = DEFAULT_ECHO_COUNT;
                this.memoryLevel = 0;
                this.treasureVisibility = 0;
                this.chestCostFree = false;
                
                this.boosterActive = false;
                this.boosterEndTime = 0;
                this.visionRange = BASE_VISION_RANGE;
                
                this.camStartX = 0;
                this.camStartY = 0;
                this.playerScreenX = 0;
                this.playerScreenY = 0;
                this.keysDown = { up: false, down: false, left: false, right: false };
                this.joystickDir = null;
                this.autoMoveActive = false;
                this.autoMovePath = [];
                this.autoMoveTarget = null;
                
                this.playerFrameIndex = 0;
                this.playerAnimationTimer = 0;
                this.playerIsMoving = false;
                this.playerDirection = 'down';
                
                this.initPixelPosition();
                this.calcCamera(0);
                this.updateScreenPos();
                this.updateUI();
                this.startAnimationLoop();
            }
        }

        let game;

        function showPreGameSelection() {
            const warehouse = new Warehouse();
            warehouse.giveStarterPack();

            const title = document.getElementById('overlay-title');
            title.textContent = '选择追忆带入';
            const selected = new Set();

            const renderSelection = () => {
                const currentItems = warehouse.getAll();
                document.getElementById('overlay-body').innerHTML = `
                    <div class="selection-counter">
                        已选择 ${selected.size} / ${SELECTION_LIMIT} 件追忆
                    </div>
                    <div class="warehouse-list" id="warehouse-list"></div>
                    <button class="start-explore-btn" id="start-explore-btn">
                        开始探索
                    </button>
                `;

                const listDiv = document.getElementById('warehouse-list');

                if (currentItems.length === 0) {
                    listDiv.innerHTML = `
                        <div style="text-align:center;color:var(--text-secondary);padding:20px;">
                            仓库空空如也<br>
                            <span style="font-size:12px;">探索迷宫获取追忆吧</span>
                        </div>
                    `;
                } else {
                    currentItems.forEach((item) => {
                        const def = CapsuleHelper.getById(item.id);
                        if (!def) return;

                        const isSelected = selected.has(item.id);
                        const div = document.createElement('div');
                        div.className = 'warehouse-item' + (isSelected ? ' selected' : '');
                        div.innerHTML = `
                            <div class="item-icon">${def.icon}</div>
                            <div class="item-info">
                                <div class="item-name">${def.name}</div>
                                <div class="item-desc">${def.description}</div>
                            </div>
                            <span class="item-badge ${def.category === 'persistent' ? 'badge-persistent' : 'badge-consumable'}">${def.category === 'persistent' ? '持久' : '消耗'}</span>
                            <span class="item-count">×${item.count}</span>
                        `;
                        div.addEventListener('click', () => {
                            if (isSelected) {
                                selected.delete(item.id);
                            } else if (selected.size < SELECTION_LIMIT) {
                                selected.add(item.id);
                            }
                            renderSelection();
                        });
                        listDiv.appendChild(div);
                    });
                }

                document.getElementById('start-explore-btn').addEventListener('click', () => {
                    const selectedCapsules = [];
                    for (const id of selected) {
                        warehouse.remove(id, 1);
                        selectedCapsules.push({ id });
                    }

                    document.getElementById('overlay').classList.remove('active');
                    document.getElementById('overlay-close').style.display = '';
                    document.getElementById('overlay-title').textContent = '背包';

                    document.getElementById('overlay-body').innerHTML = `
                        <div class="capsule-grid" id="capsule-grid"></div>
                        <div class="empty-hint" id="overlay-hint">点击追忆使用</div>
                    `;

                    game = new GameFree(selectedCapsules);
                });
            };

            document.getElementById('overlay').classList.add('active');
            document.getElementById('overlay-close').style.display = 'none';
            renderSelection();
        }

        window.addEventListener('load', () => {
            showPreGameSelection();
        });

        window.addEventListener('resize', () => {
            location.reload();
        });
    </script>
</body>
